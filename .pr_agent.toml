# Upstream The-PR-Agent/pr-agent. Credentials are injected by Actions, never
# stored here. Keep model and timeout settings aligned with pr-agent.yml.
[config]
model = "gpt-5.6-luna"
output_run_details = true
reasoning_effort = "high"
fallback_models = []
ai_timeout = 240
num_retries = 0
retry_same_model_on_timeout = false
max_model_tokens = 131072
custom_model_max_tokens = 131072

[pr_reviewer]
persistent_comment = true
final_update_message = false
require_score_review = true
require_tests_review = true
require_security_review = true

[pr_description]
publish_description_as_comment = true
add_original_user_description = true

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
suggestions_score_threshold = 6

[github_action_config]
auto_describe = false
auto_improve = false
auto_review = true
handle_push_trigger = true
push_commands = ["/review"]
