name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Require the tag, package, and changelog to agree
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          package_version="$(uv run python -c 'from side_dog import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          release_heading="$(grep -F "## [${package_version}] - " CHANGELOG.md | head -n 1)"
          test -n "$release_heading"
          release_date="${release_heading##* - }"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "CHANGELOG.md must date ${package_version} before publication" >&2
            exit 1
          fi

      - name: Run the test suite
        run: uv run python -m unittest discover -s tests -q

      - name: Build sdist and wheel
        run: uv build --clear

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install and run the built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          export UV_TOOL_DIR="${RUNNER_TEMP}/side-dog-tool"
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/side-dog-bin"
          uv tool install "$wheel"
          expected="${GITHUB_REF_NAME#v}"
          test "$("${UV_TOOL_BIN_DIR}/side-dog" --version)" = "side-dog ${expected}"
          doctor_output="$("${UV_TOOL_BIN_DIR}/side-dog" doctor . --no-color)"
          grep -F "Side Dog: Version ${expected}." <<<"$doctor_output"
          "${UV_TOOL_BIN_DIR}/side-dog" help

      - name: Save verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/side-dog
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/side-dog
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Attach distributions to the tagged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
