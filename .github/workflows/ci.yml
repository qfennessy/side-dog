name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -q

  package:
    name: Build and smoke-test the wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify the release version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python -m side_dog.release --base-ref "$BASE_REF"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install and run the built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          export UV_TOOL_DIR="${RUNNER_TEMP}/side-dog-tool"
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/side-dog-bin"
          uv tool install "$wheel"
          expected="$(uv run python -c 'from side_dog import __version__; print(__version__)')"
          test "$("${UV_TOOL_BIN_DIR}/side-dog" --version)" = "side-dog ${expected}"
          doctor_output="$("${UV_TOOL_BIN_DIR}/side-dog" doctor . --no-color)"
          grep -F "Side Dog: Version ${expected}." <<<"$doctor_output"
          "${UV_TOOL_BIN_DIR}/side-dog" help
