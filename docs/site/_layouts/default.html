<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">Side Dog</a>
      <nav aria-label="Documentation">
        <a href="{{ '/docs/install/' | relative_url }}">Install</a>
        <a href="{{ '/docs/everyday-use/' | relative_url }}">Views and controls</a>
        <a href="{{ '/docs/integrations/' | relative_url }}">Agents</a>
        <a href="{{ '/docs/configuration/' | relative_url }}">Configuration</a>
        <a href="{{ '/docs/troubleshooting/' | relative_url }}">Troubleshooting</a>
      </nav>
    </header>
    <main id="content" class="content">{{ content }}</main>
    <footer>
      <a href="https://github.com/qfennessy/side-dog">Source on GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="{{ '/docs/releasing/' | relative_url }}">Maintainer release guide</a>
    </footer>
  </body>
</html>
